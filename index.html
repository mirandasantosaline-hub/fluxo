<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #b4b4b4; padding: 15px; }
        .container { max-width: 900px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .kpi-card { border-radius: 10px; padding: 15px; color: white; text-align: center; }
        .kpi-entrada { background: linear-gradient(135deg, #11998e, #1db959); }
        .kpi-saida { background: linear-gradient(135deg, #eb3349, #c74430); }
        .kpi-saldo { background: linear-gradient(135deg, #3a50b4, #764ba2); }
        .positivo { color: #198754; font-weight: bold; }
        .negativo { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-3"><i class="bi bi-cash-stack"></i> Controle de Caixa</h3>

    <!-- Status Firebase -->
    <div class="alert alert-secondary py-1 px-2 mb-3" id="statusFirebase">
        <small><i class="bi bi-cloud"></i> Conectando...</small>
    </div>

    <!-- Filtro de Visualização -->
    <div class="row mb-3">
        <div class="col-12 text-center">
            <div class="btn-group" role="group">
                <button onclick="setarVisualizacao('dia')" id="btn-dia" class="btn btn-outline-primary btn-sm">📅 Dia</button>
                <button onclick="setarVisualizacao('mes')" id="btn-mes" class="btn btn-outline-primary btn-sm active">📆 Mês</button>
                <button onclick="setarVisualizacao('ano')" id="btn-ano" class="btn btn-outline-primary btn-sm">📊 Ano</button>
            </div>
        </div>
    </div>

    <!-- Navegação -->
    <div class="row mb-3 align-items-center">
        <div class="col-4">
            <button onclick="navegar(-1)" class="btn btn-outline-primary btn-sm w-100">◀ Anterior</button>
        </div>
        <div class="col-4 text-center fw-bold fs-5" id="tituloPeriodo"></div>
        <div class="col-4">
            <button onclick="navegar(1)" class="btn btn-outline-primary btn-sm w-100">Próximo ▶</button>
        </div>
    </div>

    <!-- KPI's -->
    <div class="row mb-3 g-2">
        <div class="col-4">
            <div class="kpi-card kpi-entrada">
                <small>ENTRADAS</small>
                <h5 id="entradasPeriodo">R$ 0,00</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card kpi-saida">
                <small>SAÍDAS</small>
                <h5 id="saidasPeriodo">R$ 0,00</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card kpi-saldo">
                <small>SALDO</small>
                <h5 id="saldoPeriodo">R$ 0,00</h5>
            </div>
        </div>
    </div>

    <!-- Hoje -->
    <div class="alert alert-light border mb-3">
        <div class="row text-center">
            <div class="col-4"><strong>HOJE</strong></div>
            <div class="col-4 positivo" id="entradasDia">+ R$ 0,00</div>
            <div class="col-4 negativo" id="saidasDia">- R$ 0,00</div>
        </div>
    </div>

    <!-- Formulário -->
    <div class="card p-3 mb-3 bg-light">
        <div class="row g-2">
            <div class="col-3">
                <select id="tipo" class="form-select form-select-sm" onchange="atualizarCategorias()">
                    <option value="entrada">💰 Entrada</option>
                    <option value="saida">💸 Saída</option>
                </select>
            </div>
            <div class="col-4">
                <input type="text" id="descricao" class="form-control form-control-sm" placeholder="Descrição" onkeydown="if(event.key==='Enter')salvar()">
            </div>
            <div class="col-2">
                <input type="number" id="valor" class="form-control form-control-sm" placeholder="R$" step="0.01" onkeydown="if(event.key==='Enter')salvar()">
            </div>
            <div class="col-2">
                <select id="categoria" class="form-select form-select-sm"></select>
            </div>
            <div class="col-1">
                <button onclick="salvar()" class="btn btn-success btn-sm w-100">✓</button>
            </div>
        </div>
    </div>

    <!-- Lista -->
    <div class="table-responsive">
        <table class="table table-sm table-hover">
            <thead class="table-light">
                <tr>
                    <th>Data/Hora</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <!-- Mensagem -->
    <div class="alert alert-info mt-3 mb-0">
        <small id="msgStatus">Aguardando dados...</small>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
    // =====================================================
    // ⚠️ CONFIGURAÇÃO DO FIREBASE - PREENCHA OS DADOS ⚠️
    // =====================================================
   const firebaseConfig = {
  apiKey: "AIzaSyDf0nUq26WQr3-NCu7d6lJNzczrOXVMz-M",
  authDomain: "fluxo-fdc89.firebaseapp.com",
  projectId: "fluxo-fdc89",
  storageBucket: "fluxo-fdc89.firebasestorage.app",
  messagingSenderId: "695652693338",
  appId: "1:695652693338:web:0b5dcb218f543150d72f63",
  measurementId: "G-6EF9MEZRNF"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ID único do usuário
    let userId = localStorage.getItem('atelier_user_id');
    if (!userId) {
        userId = 'user_' + Date.now();
        localStorage.setItem('atelier_user_id', userId);
    }

    // Referência Firestore
    const userRef = db.collection('usuarios').doc(userId).collection('movimentacoes');

    // Variáveis
    let visualizacao = 'mes';
    let dataNav = new Date();
    let mesNav = dataNav.getMonth();
    let anoNav = dataNav.getFullYear();
    let diaNav = dataNav.getDate();
    let movimentacoes = [];
    let unsubscribe = null;

    const catsEntrada = ['servico', 'produto', 'outros'];
    const catsSaida = ['material', 'luz', 'internet', 'aluguel', 'funcionario', 'outros'];

    // Inicializar
    async function init() {
        atualizarCategorias();
        await carregarDados();
        renderizar();
    }

    // Carregar dados do Firebase
    async function carregarDados() {
        try {
            if (unsubscribe) unsubscribe();

            unsubscribe = userRef.orderBy('data', 'desc').onSnapshot({
                next: (snapshot) => {
                    movimentacoes = [];
                    snapshot.forEach((doc) => {
                        movimentacoes.push({ id: doc.id, ...doc.data() });
                    });
                    renderizar();
                    atualizarStatus('✅ Sincronizado', 'success');
                },
                error: (error) => {
                    console.error('Erro:', error);
                    atualizarStatus('❌ Erro: ' + error.message, 'danger');
                }
            });
        } catch (e) {
            console.error('Erro:', e);
            atualizarStatus('❌ Erro: ' + e.message, 'danger');
        }
    }

    function atualizarStatus(msg, tipo) {
        document.getElementById('statusFirebase').className = 'alert alert-' + tipo + ' py-1 px-2 mb-3';
        document.getElementById('statusFirebase').innerHTML = '<small><i class="bi bi-cloud-fill"></i> ' + msg + '</small>';
    }

    function atualizarCategorias() {
        const sel = document.getElementById('categoria');
        const cats = document.getElementById('tipo').value === 'entrada' ? catsEntrada : catsSaida;
        sel.innerHTML = cats.map(c => '<option value="' + c + '">' + c.charAt(0).toUpperCase() + c.slice(1) + '</option>').join('');
    }

    function setarVisualizacao(tipo) {
        visualizacao = tipo;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tipo).classList.add('active');
        dataNav = new Date();
        mesNav = dataNav.getMonth();
        anoNav = dataNav.getFullYear();
        diaNav = dataNav.getDate();
        renderizar();
    }

    function navegar(delta) {
        if (visualizacao === 'mes') {
            mesNav += delta;
            if (mesNav > 11) { mesNav = 0; anoNav++; }
            if (mesNav < 0) { mesNav = 11; anoNav--; }
        } else if (visualizacao === 'ano') {
            anoNav += delta;
        } else {
            dataNav.setDate(dataNav.getDate() + delta);
            diaNav = dataNav.getDate();
            mesNav = dataNav.getMonth();
            anoNav = dataNav.getFullYear();
        }
        renderizar();
    }

    function formatar(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatarData(dataISO) {
        const d = new Date(dataISO);
        return String(d.getDate()).padStart(2, '0') + '/' + 
               String(d.getMonth() + 1).padStart(2, '0') + '/' + 
               d.getFullYear() + ' ' + 
               String(d.getHours()).padStart(2, '0') + ':' + 
               String(d.getMinutes()).padStart(2, '0');
    }

    function keyMes(dataISO) {
        const d = new Date(dataISO);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function keyDia(dataISO) {
        return dataISO.split('T')[0];
    }

    function keyAno(dataISO) {
        return new Date(dataISO).getFullYear().toString();
    }

    async function salvar() {
        const tipo = document.getElementById('tipo').value;
        const desc = document.getElementById('descricao').value.trim();
        const valor = parseFloat(document.getElementById('valor').value);
        const cat = document.getElementById('categoria').value;

        if (!desc || isNaN(valor) || valor <= 0) {
            alert('Preencha descrição e valor válido!');
            return;
        }

        try {
            await userRef.add({
                tipo: tipo,
                descricao: desc,
                valor: valor,
                categoria: cat,
                data: new Date().toISOString(),
                userId: userId
            });

            document.getElementById('descricao').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('descricao').focus();
            document.getElementById('msgStatus').textContent = '💾 Salvo em ' + new Date().toLocaleTimeString();
        } catch (e) {
            alert('Erro ao salvar: ' + e.message);
        }
    }

    async function excluir(id) {
        if (!confirm('Excluir?')) return;
        try {
            await userRef.doc(id).delete();
        } catch (e) {
            alert('Erro: ' + e.message);
        }
    }

    function renderizar() {
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        
        let titulo = '';
        let key = '';
        
        if (visualizacao === 'mes') {
            key = anoNav + '-' + String(mesNav + 1).padStart(2, '0');
            titulo = meses[mesNav] + ' / ' + anoNav;
        } else if (visualizacao === 'ano') {
            key = anoNav.toString();
            titulo = 'Ano de ' + anoNav;
        } else {
            key = anoNav + '-' + String(mesNav + 1).padStart(2, '0') + '-' + String(diaNav).padStart(2, '0');
            titulo = String(diaNav).padStart(2, '0') + '/' + String(mesNav + 1).padStart(2, '0') + '/' + anoNav;
        }
        
        document.getElementById('tituloPeriodo').textContent = titulo;

        const hoje = new Date().toISOString().split('T')[0];

        let periodo = movimentacoes.filter(m => {
            if (visualizacao === 'mes') return keyMes(m.data) === key;
            if (visualizacao === 'ano') return keyAno(m.data) === key;
            return keyDia(m.data) === key;
        });

        let dayToday = movimentacoes.filter(m => keyDia(m.data) === hoje);

        let entP = 0, saiP = 0;
        periodo.forEach(m => m.tipo === 'entrada' ? entP += m.valor : saiP += m.valor);

        let entD = 0, saiD = 0;
        dayToday.forEach(m => m.tipo === 'entrada' ? entD += m.valor : saiD += m.valor);

        document.getElementById('entradasPeriodo').textContent = formatar(entP);
        document.getElementById('saidasPeriodo').textContent = formatar(saiP);
        document.getElementById('saldoPeriodo').textContent = formatar(entP - saiP);
        document.getElementById('entradasDia').textContent = '+ ' + formatar(entD);
        document.getElementById('saidasDia').textContent = '- ' + formatar(saiD);

        const lista = document.getElementById('lista');
        if (periodo.length === 0) {
            lista.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhuma movimentação</td></tr>';
        } else {
            lista.innerHTML = periodo.map(m => {
                const badge = m.tipo === 'entrada' ? '<span class="badge bg-success">ENT</span>' : '<span class="badge bg-danger">SAI</span>';
                const val = m.tipo === 'entrada' ? '<span class="positivo">+' + formatar(m.valor) + '</span>' : '<span class="negativo">-' + formatar(m.valor) + '</span>';
                return '<tr><td><small>' + formatarData(m.data) + '</small></td><td>' + badge + '</td><td>' + m.descricao + '</td><td>' + val + '</td><td><button onclick="excluir(\'' + m.id + '\')" class="btn btn-sm btn-outline-danger">×</button></td></tr>';
            }).join('');
        }
    }

    // Iniciar
    init();
</script>

</body>
</html>
