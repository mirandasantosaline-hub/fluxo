<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowFin - Fluxo de Caixa </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #dadada 0%, #cabebe 100%);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .glass-card {
            background: #f8f9fa8e;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-item {
            background: #f8f9fa8e;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .kpi-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            color: #2c3e50;
        }

        .kpi-entrada .kpi-value { color: #10b981; }
        .kpi-saida .kpi-value { color: #ef4444; }
        .kpi-saldo .kpi-value { color: #2c53d3; }

        .config-bar {
            background: #f8f9fa8e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-bar {
            background: #f8f9fa8e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-btn {
            padding: 8px 20px;
            border: 1px solid #dee2e6;
            background: #f8f9fa8e;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .form-card {
            background: #f8f9fa8e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .form-control-custom {
            padding: 10px 12px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 42px;
            width: 100%;
        }

        .table-container {
            background: #f8f9fa8e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .table-custom {
            width: 100%;
            margin: 0;
        }

        .table-custom thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .table-custom th {
            padding: 15px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-custom td {
            padding: 12px 15px;
            vertical-align: middle;
        }

        .badge-custom {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-entrada {
            background: #f8f9fa8e;
            color: #065f46;
        }

        .badge-saida {
            background: #f8f9fa8e;
            color: #991b1b;
        }

        .today-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .alert-danger-custom {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .kpi-value { font-size: 24px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1><i class="bi bi-graph-up"></i> FlowFin</h1>
        <p>Controle financeiro profissional • Sincronizado em tempo real</p>
    </div>

    <!-- Alerta de erro -->
    <div id="errorAlert" style="display: none;" class="alert-danger-custom">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span id="errorMessage"></span>
    </div>

    <div class="glass-card">
        <div class="config-bar">
            <div class="d-flex gap-2 align-items-center">
                <i class="bi bi-database" style="color: #667eea;"></i>
                <label class="fw-bold mb-0">Banco de Dados:</label>
                <select id="bancoSelecionado" class="form-control-custom" style="width: auto;" onchange="trocarBanco()">
                    <option value="padrao">Banco Padrão</option>
                </select>
                <button onclick="abrirModalBanco()" class="btn-save" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 8px 16px; width: auto;">
                    <i class="bi bi-plus-circle"></i> Novo
                </button>
            </div>
            <div class="status-badge" id="statusFirebase">
                <i class="bi bi-cloud"></i>
                <span>Conectando...</span>
            </div>
        </div>
        <div id="infoBanco" class="mt-2">
            <small class="text-muted"><i class="bi bi-info-circle"></i> Banco Padrão ativo</small>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-item kpi-entrada">
            <div class="kpi-label"><i class="bi bi-arrow-up-circle"></i> ENTRADAS</div>
            <div class="kpi-value" id="entradasPeriodo">R$ 0,00</div>
        </div>
        <div class="kpi-item kpi-saida">
            <div class="kpi-label"><i class="bi bi-arrow-down-circle"></i> SAÍDAS</div>
            <div class="kpi-value" id="saidasPeriodo">R$ 0,00</div>
        </div>
        <div class="kpi-item kpi-saldo">
            <div class="kpi-label"><i class="bi bi-wallet2"></i> SALDO</div>
            <div class="kpi-value" id="saldoPeriodo">R$ 0,00</div>
        </div>
    </div>

    <div class="today-card">
        <div><i class="bi bi-calendar-day"></i> <strong>RESUMO DO DIA</strong></div>
        <div class="d-flex gap-4">
            <div><div class="small opacity-75">ENTRADAS</div><div id="entradasDia">+ R$ 0,00</div></div>
            <div><div class="small opacity-75">SAÍDAS</div><div id="saidasDia">- R$ 0,00</div></div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="d-flex gap-2">
            <button onclick="setarVisualizacao('dia')" id="btn-dia" class="view-btn">📅 Dia</button>
            <button onclick="setarVisualizacao('mes')" id="btn-mes" class="view-btn active">📆 Mês</button>
            <button onclick="setarVisualizacao('ano')" id="btn-ano" class="view-btn">📊 Ano</button>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <button onclick="navegar(-1)" class="nav-btn view-btn">◀ Anterior</button>
            <div class="fw-bold fs-5" id="tituloPeriodo"></div>
            <button onclick="navegar(1)" class="nav-btn view-btn">Próximo ▶</button>
        </div>
    </div>

    <div class="form-card">
        <div class="form-grid">
            <div>
                <label class="small fw-bold text-muted">TIPO</label>
                <select id="tipo" class="form-control-custom w-100" onchange="atualizarCategorias()">
                    <option value="entrada">💰 Entrada</option>
                    <option value="saida">💸 Saída</option>
                </select>
            </div>
            <div>
                <label class="small fw-bold text-muted">DESCRIÇÃO</label>
                <input type="text" id="descricao" class="form-control-custom w-100" placeholder="Ex: Venda de serviço">
            </div>
            <div>
                <label class="small fw-bold text-muted">VALOR</label>
                <input type="number" id="valor" class="form-control-custom w-100" placeholder="R$ 0,00" step="0.01">
            </div>
            <div>
                <label class="small fw-bold text-muted">CATEGORIA</label>
                <select id="categoria" class="form-control-custom w-100"></select>
            </div>
            <div>
                <button onclick="salvar()" class="btn-save"><i class="bi bi-check-lg"></i> Salvar</button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table class="table-custom">
            <thead>
                <tr><th>Data/Hora</th><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr>
            </thead>
            <tbody id="lista"><tr><td colspan="6" class="text-center text-muted py-5">Nenhuma movimentação</td></tr></tbody>
         </table>
    </div>

    <div class="glass-card mt-3">
        <small id="msgStatus" class="text-muted"><i class="bi bi-info-circle"></i> Sistema pronto</small>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalBanco" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-database-add"></i> Novo Banco</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="novoBancoNome" class="form-control-custom w-100" placeholder="Nome do banco">
                <textarea id="novoBancoConfig" class="form-control-custom w-100 mt-3" rows="3" placeholder="Configuração Firebase (opcional)"></textarea>
            </div>
            <div class="modal-footer">
                <button class="view-btn" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn-save" onclick="adicionarBanco()">Adicionar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const firebaseConfig = {
         apiKey: "AIzaSyDVAfG-OBfX25IzdH1PnU8cKp-6iCRBJ4E",
         authDomain: "fluxo-197da.firebaseapp.com",
         projectId: "fluxo-197da",
         storageBucket: "fluxo-197da.firebasestorage.app",
         messagingSenderId: "916653128630",
         appId: "1:916653128630:web:6e5566c6a26811472adf17",
         measurementId: "G-WHXJP2M7K7"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let userId = localStorage.getItem('fluxo_user_id');
    if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('fluxo_user_id', userId);
    }
    
    let currentUnsubscribe = null;
    let bancos = [];
    let bancoAtual = null;
    let movimentacoes = [];
    let visualizacao = 'mes';
    let dataNav = new Date();
    let mesNav = dataNav.getMonth();
    let anoNav = dataNav.getFullYear();
    let diaNav = dataNav.getDate();

    const catsEntrada = ['servico', 'produto', 'outros'];
    const catsSaida = ['material', 'luz', 'internet', 'aluguel', 'funcionario', 'outros'];

    function mostrarErro(mensagem) {
        const alertDiv = document.getElementById('errorAlert');
        document.getElementById('errorMessage').innerHTML = mensagem;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 5000);
    }

    function carregarBancos() {
        const saved = localStorage.getItem('fluxo_bancos');
        bancos = saved ? JSON.parse(saved) : [{ id: 'padrao', nome: 'Banco Padrão' }];
        const bancoIdAtual = localStorage.getItem('fluxo_banco_atual');
        bancoAtual = bancos.find(b => b.id === bancoIdAtual) || bancos[0];
        atualizarSelectBancos();
        if (bancoAtual) conectarBanco();
    }
    
    function salvarBancos() { localStorage.setItem('fluxo_bancos', JSON.stringify(bancos)); }
    
    function atualizarSelectBancos() {
        const select = document.getElementById('bancoSelecionado');
        select.innerHTML = bancos.map(b => `<option value="${b.id}">${b.nome}</option>`).join('');
        if (bancoAtual) select.value = bancoAtual.id;
    }
    
    function trocarBanco() {
        bancoAtual = bancos.find(b => b.id === document.getElementById('bancoSelecionado').value);
        if (bancoAtual) {
            localStorage.setItem('fluxo_banco_atual', bancoAtual.id);
            conectarBanco();
        }
    }
    
    function abrirModalBanco() { new bootstrap.Modal(document.getElementById('modalBanco')).show(); }
    
    function adicionarBanco() {
        const nome = document.getElementById('novoBancoNome').value.trim();
        if (!nome) return alert('Digite um nome!');
        const novoBanco = { id: 'banco_' + Date.now(), nome: nome };
        bancos.push(novoBanco);
        salvarBancos();
        atualizarSelectBancos();
        if (confirm(`Usar "${nome}" agora?`)) {
            bancoAtual = novoBanco;
            localStorage.setItem('fluxo_banco_atual', bancoAtual.id);
            conectarBanco();
        }
        bootstrap.Modal.getInstance(document.getElementById('modalBanco')).hide();
    }
    
    function conectarBanco() {
        if (!bancoAtual) return;
        const userRef = db.collection('usuarios').doc(userId).collection('movimentacoes');
        if (currentUnsubscribe) currentUnsubscribe();
        
        const statusDiv = document.getElementById('statusFirebase');
        statusDiv.innerHTML = '<i class="bi bi-cloud"></i><span> Conectando...</span>';
        
        currentUnsubscribe = userRef.orderBy('data', 'desc').onSnapshot({
            next: (snapshot) => {
                movimentacoes = [];
                snapshot.forEach(doc => movimentacoes.push({ id: doc.id, ...doc.data() }));
                renderizar();
                statusDiv.innerHTML = '<i class="bi bi-cloud-check"></i><span> Sincronizado</span>';
                document.getElementById('infoBanco').innerHTML = `<small class="text-success">✅ ${bancoAtual.nome} • ${movimentacoes.length} registros</small>`;
            },
            error: (error) => {
                console.error('Firestore Error:', error);
                statusDiv.innerHTML = '<i class="bi bi-cloud-slash"></i><span> Erro</span>';
                mostrarErro(`Erro de conexão: ${error.message}. Verifique as regras do Firebase.`);
            }
        });
    }
    
    function atualizarCategorias() {
        const cats = document.getElementById('tipo').value === 'entrada' ? catsEntrada : catsSaida;
        document.getElementById('categoria').innerHTML = cats.map(c => `<option value="${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('');
    }
    
    function setarVisualizacao(tipo) {
        visualizacao = tipo;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tipo).classList.add('active');
        const agora = new Date();
        mesNav = agora.getMonth(); anoNav = agora.getFullYear(); diaNav = agora.getDate();
        renderizar();
    }
    
    function navegar(delta) {
        if (visualizacao === 'mes') {
            mesNav += delta;
            if (mesNav > 11) { mesNav = 0; anoNav++; }
            if (mesNav < 0) { mesNav = 11; anoNav--; }
        } else if (visualizacao === 'ano') {
            anoNav += delta;
        } else {
            dataNav.setDate(dataNav.getDate() + delta);
            diaNav = dataNav.getDate();
            mesNav = dataNav.getMonth();
            anoNav = dataNav.getFullYear();
        }
        renderizar();
    }
    
    function formatar(valor) { return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function formatarData(dataISO) {
        const d = new Date(dataISO);
        return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }
    
    async function salvar() {
        const tipo = document.getElementById('tipo').value;
        const desc = document.getElementById('descricao').value.trim();
        const valor = parseFloat(document.getElementById('valor').value);
        const cat = document.getElementById('categoria').value;
        
        if (!desc || isNaN(valor) || valor <= 0) {
            alert('Preencha descrição e valor válido!');
            return;
        }
        
        try {
            await db.collection('usuarios').doc(userId).collection('movimentacoes').add({
                tipo, descricao: desc, valor, categoria: cat,
                data: new Date().toISOString(), userId, criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            document.getElementById('descricao').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('descricao').focus();
            document.getElementById('msgStatus').innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> Salvo com sucesso!';
            setTimeout(() => document.getElementById('msgStatus').innerHTML = '<i class="bi bi-info-circle"></i> Sistema pronto', 2000);
        } catch (error) {
            console.error('Erro ao salvar:', error);
            mostrarErro(`Erro ao salvar: ${error.message}. Verifique as regras do Firebase.`);
            alert('Erro ao salvar. Verifique o console e as regras do Firebase.');
        }
    }
    
    async function excluir(id) {
        if (!confirm('Excluir esta movimentação?')) return;
        try {
            await db.collection('usuarios').doc(userId).collection('movimentacoes').doc(id).delete();
            document.getElementById('msgStatus').innerHTML = '<i class="bi bi-trash-fill"></i> Excluído!';
        } catch (error) {
            alert('Erro: ' + error.message);
        }
    }
    
    function renderizar() {
        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        let titulo = '', key = '';
        
        if (visualizacao === 'mes') {
            key = `${anoNav}-${(mesNav+1).toString().padStart(2,'0')}`;
            titulo = `${meses[mesNav]} / ${anoNav}`;
        } else if (visualizacao === 'ano') {
            key = anoNav.toString();
            titulo = `Ano de ${anoNav}`;
        } else {
            key = `${anoNav}-${(mesNav+1).toString().padStart(2,'0')}-${diaNav.toString().padStart(2,'0')}`;
            titulo = `${diaNav.toString().padStart(2,'0')}/${(mesNav+1).toString().padStart(2,'0')}/${anoNav}`;
        }
        
        document.getElementById('tituloPeriodo').textContent = titulo;
        const hoje = new Date().toISOString().split('T')[0];
        
        const periodo = movimentacoes.filter(m => {
            if (visualizacao === 'mes') return m.data?.split('T')[0].substring(0,7) === key;
            if (visualizacao === 'ano') return m.data?.split('-')[0] === key;
            return m.data?.split('T')[0] === key;
        });
        
        const dayToday = movimentacoes.filter(m => m.data?.split('T')[0] === hoje);
        
        let entP = 0, saiP = 0;
        periodo.forEach(m => m.tipo === 'entrada' ? entP += m.valor : saiP += m.valor);
        let entD = 0, saiD = 0;
        dayToday.forEach(m => m.tipo === 'entrada' ? entD += m.valor : saiD += m.valor);
        
        document.getElementById('entradasPeriodo').innerHTML = formatar(entP);
        document.getElementById('saidasPeriodo').innerHTML = formatar(saiP);
        document.getElementById('saldoPeriodo').innerHTML = formatar(entP - saiP);
        document.getElementById('entradasDia').innerHTML = '+ ' + formatar(entD);
        document.getElementById('saidasDia').innerHTML = '- ' + formatar(saiD);
        
        const lista = document.getElementById('lista');
        if (periodo.length === 0) {
            lista.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">Nenhuma movimentação</td></tr>';
        } else {
            lista.innerHTML = periodo.map(m => `
                <tr>
                    <td><small>${formatarData(m.data)}</small></td>
                    <td><span class="badge-custom ${m.tipo === 'entrada' ? 'badge-entrada' : 'badge-saida'}">${m.tipo === 'entrada' ? '💰 ENTRADA' : '💸 SAÍDA'}</span></td>
                    <td>${m.descricao}</td>
                    <td><span class="badge bg-light text-dark">${m.categoria}</span></td>
                    <td class="${m.tipo === 'entrada' ? 'text-success' : 'text-danger'} fw-bold">${m.tipo === 'entrada' ? '+' : '-'} ${formatar(m.valor)}</td>
                    <td><button onclick="excluir('${m.id}')" class="btn btn-sm btn-link text-danger"><i class="bi bi-trash"></i></button></td>
                </tr>
            `).join('');
        }
    }
    
    atualizarCategorias();
    carregarBancos();
</script>
</body>
</html>
