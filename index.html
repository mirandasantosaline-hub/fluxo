<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa - Atelier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #b4b4b4; padding: 15px; }
        .container { max-width: 900px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .kpi-card { border-radius: 10px; padding: 15px; color: white; text-align: center; }
        .kpi-entrada { background: linear-gradient(135deg, #11998e, #1db959); }
        .kpi-saida { background: linear-gradient(135deg, #eb3349, #c74430); }
        .kpi-saldo { background: linear-gradient(135deg, #3a50b4, #764ba2); }
        .positivo { color: #198754; font-weight: bold; }
        .negativo { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-3"><i class="bi bi-cash-stack"></i> Controle de Caixa</h3>

    <!-- Navegação de Meses -->
    <div class="row mb-3 align-items-center">
        <div class="col-4">
            <button onclick="mudarMes(-1)" class="btn btn-outline-primary btn-sm w-100">◀ Anterior</button>
        </div>
        <div class="col-4 text-center fw-bold fs-5" id="tituloMes"></div>
        <div class="col-4">
            <button onclick="mudarMes(1)" class="btn btn-outline-primary btn-sm w-100">Próximo ▶</button>
        </div>
    </div>

    <!-- KPI's do Mês -->
    <div class="row mb-3 g-2">
        <div class="col-4">
            <div class="kpi-card kpi-entrada">
                <small>ENTRADAS</small>
                <h5 id="entradasMes">R$ 0,00</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card kpi-saida">
                <small>SAÍDAS</small>
                <h5 id="saidasMes">R$ 0,00</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="kpi-card kpi-saldo">
                <small>SALDO</small>
                <h5 id="saldoMes">R$ 0,00</h5>
            </div>
        </div>
    </div>

    <!-- KPI's de Hoje -->
    <div class="alert alert-light border mb-3">
        <div class="row text-center">
            <div class="col-4"><strong>HOJE</strong></div>
            <div class="col-4 positivo" id="entradasDia">+ R$ 0,00</div>
            <div class="col-4 negativo" id="saidasDia">- R$ 0,00</div>
        </div>
    </div>

    <!-- Formulário -->
    <div class="card p-3 mb-3 bg-light">
        <div class="row g-2">
            <div class="col-3">
                <select id="tipo" class="form-select form-select-sm" onchange="atualizarCategorias()">
                    <option value="entrada">💰 Entrada</option>
                    <option value="saida">💸 Saída</option>
                </select>
            </div>
            <div class="col-4">
                <input type="text" id="descricao" class="form-control form-control-sm" placeholder="Descrição" onkeydown="if(event.key==='Enter')salvar()">
            </div>
            <div class="col-2">
                <input type="number" id="valor" class="form-control form-control-sm" placeholder="R$" step="0.01" onkeydown="if(event.key==='Enter')salvar()">
            </div>
            <div class="col-2">
                <select id="categoria" class="form-select form-select-sm"></select>
            </div>
            <div class="col-1">
                <button onclick="salvar()" class="btn btn-success btn-sm w-100">✓</button>
            </div>
        </div>
    </div>

    <!-- Lista -->
    <div class="table-responsive">
        <table class="table table-sm table-hover">
            <thead class="table-light">
                <tr>
                    <th>Data / Hora</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <!-- Mensagem -->
    <div class="alert alert-info mt-3 mb-0">
        <small>💾 Dados salvos automaticamente no navegador</small>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ========== BANCO DE DADOS LOCAL ==========
    const CHAVE = 'atelier_caixa';
    
    let mesAtual = new Date().getMonth();
    let anoAtual = new Date().getFullYear();
    let movimentacoes = [];

    const categoriasEntrada = ['servico', 'produto', 'outros'];
    const categoriasSaida = ['material', 'luz', 'internet', 'aluguel', 'funcionario', 'outros'];

    // Carrega dados ao iniciar
    function init() {
        const dados = localStorage.getItem(CHAVE);
        if (dados) {
            movimentacoes = JSON.parse(dados);
        }
        atualizarCategorias();
        renderizar();
    }

    // Salva no localStorage
    function salvarDados() {
        localStorage.setItem(CHAVE, JSON.stringify(movimentacoes));
    }

    // Atualiza categorias
    function atualizarCategorias() {
        const select = document.getElementById('categoria');
        const cats = document.getElementById('tipo').value === 'entrada' ? categoriasEntrada : categoriasSaida;
        select.innerHTML = cats.map(c => `<option value="${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('');
    }

    // Navegar meses
    function mudarMes(delta) {
        mesAtual += delta;
        if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
        if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
        renderizar();
    }

    // Formatar dinheiro
    function formatar(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Format ar data e hora
    function formatarDataHora(dataISO) {
        const d = new Date(dataISO);
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const ano = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const minuto = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${ano} ${hora}:${minuto}`;
    }

    // Get key do mês
    function getKeyMes(dataISO) {
        const d = new Date(dataISO);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // Get key do dia
    function getKeyDia(dataISO) {
        return dataISO.split('T')[0];
    }

    // Salvar nova movimentação
    function salvar() {
        const tipo = document.getElementById('tipo').value;
        const descricao = document.getElementById('descricao').value.trim();
        const valor = parseFloat(document.getElementById('valor').value);
        const categoria = document.getElementById('categoria').value;

        if (!descricao || isNaN(valor) || valor <= 0) {
            alert('Preencha descrição e valor!');
            return;
        }

        const novaMov = {
            id: Date.now(),
            tipo: tipo,
            descricao: descricao,
            valor: valor,
            categoria: categoria,
            data: new Date().toISOString()
        };

        movimentacoes.unshift(novaMov);
        salvarDados();
        renderizar();

        // Limpa campos
        document.getElementById('descricao').value = '';
        document.getElementById('valor').value = '';
        document.getElementById('descricao').focus();
    }

    // Excluir
    function excluir(id) {
        if (!confirm('Excluir esta movimentação?')) return;
        movimentacoes = movimentacoes.filter(m => m.id !== id);
        salvarDados();
        renderizar();
    }

    // Renderizarinterface
    function renderizar() {
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const keyMes = `${anoAtual}-${String(mesAtual + 1).padStart(2, '0')}`;
        
        document.getElementById('tituloMes').textContent = `${meses[mesAtual]} / ${anoAtual}`;

        const hoje = new Date().toISOString().split('T')[0];

        // Filtra movimentações do mês
        const movMes = movimentacoes.filter(m => getKeyMes(m.data) === keyMes);
        const movHoje = movimentacoes.filter(m => getKeyDia(m.data) === hoje);

        // Calcula totais do MÊS
        let entMes = 0, saiMes = 0;
        movMes.forEach(m => {
            if (m.tipo === 'entrada') entMes += m.valor;
            else saiMes += m.valor;
        });

        // Calcula totais do DIA
        let entDia = 0, saiDia = 0;
        movHoje.forEach(m => {
            if (m.tipo === 'entrada') entDia += m.valor;
            else saiDia += m.valor;
        });

        // Atualiza KPIs
        document.getElementById('entradasMes').textContent = formatar(entMes);
        document.getElementById('saidasMes').textContent = formatar(saiMes);
        document.getElementById('saldoMes').textContent = formatar(entMes - saiMes);
        document.getElementById('entradasDia').textContent = '+ ' + formatar(entDia);
        document.getElementById('saidasDia').textContent = '- ' + formatar(saiDia);

        // Renderiza lista
        const lista = document.getElementById('lista');
        lista.innerHTML = movMes
            .sort((a, b) => new Date(b.data) - new Date(a.data))
            .map(m => {
                const badge = m.tipo === 'entrada' 
                    ? '<span class="badge bg-success">ENT</span>' 
                    : '<span class="badge bg-danger">SAI</span>';
                const valorStr = m.tipo === 'entrada' 
                    ? `<span class="positivo">+${formatar(m.valor)}</span>` 
                    : `<span class="negativo">-${formatar(m.valor)}</span>`;
                
                return `<tr>
                    <td><small>${formatarDataHora(m.data)}</small></td>
                    <td>${badge}</td>
                    <td>${m.descricao}</td>
                    <td>${valorStr}</td>
                    <td><button onclick="excluir(${m.id})" class="btn btn-sm btn-outline-danger">×</button></td>
                </tr>`;
            }).join('');
    }

    // Inicia
    init();
</script>

</body>
</html>
